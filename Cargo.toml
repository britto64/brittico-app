[package]
name = "brittico-app"
description = "O Brittico como programa: o site (brittico.xyz) copiado tela por tela, hoje o Início e a Call. Protótipo só de interface, com dados de mentira."
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "brittico"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["glow", "x11", "wayland"] }
egui_extras = { version = "0.31", default-features = false, features = ["svg", "image", "http"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
# o "escolher imagem" do overlay do LivePixel: o diálogo do sistema (no Linux pelo portal, sem carregar o GTK)
rfd = "0.15"
# os dados de mentira da home (assets/mock/home.json) e as datas dela
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# a API do Brittico (a mesma do site) e os WebSockets do LivePixel e da Call
ureq = { version = "3", default-features = false, features = ["native-tls", "json"] }
tungstenite = { version = "0.29", default-features = false, features = ["handshake", "native-tls"] }
# a voz da Call: a sala do LiveKit (a mesma versão do Olheiro) e o runtime dela
livekit = { version = "=0.9.6", default-features = false, features = ["native", "rustls-tls-webpki-roots"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync"] }
futures-util = { version = "0.3", default-features = false }
# o LoL de proximidade: o Olheiro inteiro (leitura do LoL, sala de voz, som), do repositório olheiro-voz ao lado
olheiro-motor = { path = "../olheiro-voz/crates/olheiro-motor" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
