[workspace]
resolver = "2"
members = [".", "crates/olheiro-core", "crates/olheiro-voz", "crates/olheiro-motor", "crates/tela-hw"]

[workspace.package]
version = "0.2.4"
edition = "2021"
publish = false

[package]
name = "brittico-app"
description = "O Brittico como programa: o site (brittico.xyz) tela por tela: Início, Jogos, LivePixel, Call com voz e tela, perfil e configurações."
version = "1.0.15"
edition = "2021"
publish = false

[[bin]]
name = "brittico"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["glow", "x11", "wayland"] }
egui_extras = { version = "0.31", default-features = false, features = ["svg", "image", "http"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
# o "escolher imagem" do overlay do LivePixel: o diálogo do sistema (no Linux pelo portal, sem carregar o GTK)
rfd = "0.15"
# os dados de mentira da home (assets/mock/home.json) e as datas dela
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
# a conferência do arquivo da atualização com o SHA256SUMS.txt do lançamento
sha2 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# a API do Brittico (a mesma do site) e os WebSockets do LivePixel e da Call
ureq = { version = "3", default-features = false, features = ["native-tls", "json"] }
tungstenite = { version = "0.29", default-features = false, features = ["handshake", "native-tls"] }
# a voz da Call: a sala do LiveKit (a mesma versão do Olheiro) e o runtime dela
livekit = { version = "=0.9.6", default-features = false, features = ["native", "rustls-tls-webpki-roots", "glib-main-loop"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync"] }
futures-util = { version = "0.3", default-features = false }
# o LoL de proximidade: o motor do Olheiro (leitura do LoL, sala de voz, som), agora dentro deste repositório (crates/)
olheiro-motor = { path = "crates/olheiro-motor" }

# H.264 da tela por hardware no Windows (Media Foundation). Nos outros sistemas o crate não codifica.
tela-hw = { path = "crates/tela-hw" }

# o cursor do mouse na tela mostrada (a captura do LiveKit no Windows não o desenha): GetCursorInfo/GetIconInfo/GetDIBits
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_System_LibraryLoader"] }

# o ícone e a versão dentro do brittico.exe (só quando o build roda num Windows, como no GitHub Actions)
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
